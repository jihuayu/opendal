[package]
name = "opendal-zig-native"
publish = false
edition = "2024"
homepage = "https://opendal.apache.org/"
license = "Apache-2.0"
repository = "https://github.com/apache/opendal"
rust-version = "1.85"

[lib]
crate-type = ["staticlib"]

[dependencies]
bytes = "1.10"
futures = "0.3"
http = "1.1"
libc = "0.2"
opendal = { path = "../../../core", features = ["blocking"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time"] }
